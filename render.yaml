services:
  - type: web
    name: cashflow-sentinel
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AWS_REGION
        value: ap-southeast-2
      - key: BEDROCK_MODEL_ID
        value: amazon.nova-lite-v1:0
      - key: DDB_TABLE
        value: CashFlowAnalyses
      - key: PAYMENTS_TABLE
        value: CashFlowPayments
      - key: S3_BUCKET
        value: cashflow-sentinel-pallavi-2026
      - key: S3_KEY
        value: sample-transaction.csv
      - key: RECEIPTS_BUCKET
        value: cashflow-sentinel-pallavi-2026
      - key: AWS_API_BASE_URL
        value: https://1qi4kyk8ak.execute-api.ap-southeast-2.amazonaws.com
      - key: SES_FROM_EMAIL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
